<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>备忘录日历</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="备忘录日历">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background-color: #f4f7fa;
      padding: 12px;
    }
    .app-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-bar h1 {
      font-size: 20px;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #6b7280; }
    .calendar-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px #00000012;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .week-name {
      text-align: center;
      font-size: 13px;
      color: #666;
      padding: 4px;
    }
    .day-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      aspect-ratio: 1/1;
      border-radius: 8px;
      padding: 4px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #eee;
      position: relative;
    }
    .day-cell.active {
      background: #dbeafe;
      border-color: #3b82f6;
    }
    .day-cell.has-memo::after {
      content: "";
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
      right: 4px;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
      padding: 16px;
    }
    .modal-title {
      font-size: 18px;
      margin-bottom: 12px;
    }
    textarea, input[type=text] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      margin: 8px 0;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .tip-text {
      font-size: 13px;
      color: #555;
    }
    .memo-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .memo-item img {
      max-width: 100%;
      border-radius: 6px;
      margin: 4px 0;
    }
    .memo-preview-box {
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-bar">
    <h1>备忘录日历</h1>
    <div>
      <button class="btn" onclick="pullPushSync()">立即同步</button>
      <button class="btn btn-secondary" onclick="openSettingModal()">设置</button>
    </div>
  </div>
  <div class="tip-text" id="syncStatus">同步：未加载</div>
  <div class="calendar-wrap">
    <div class="calendar-header">
      <button class="btn" onclick="prevMonth()">&lt;</button>
      <h2 id="monthTitle">2026-09</h2>
      <button class="btn" onclick="nextMonth()">&gt;</button>
    </div>
    <div class="week-row">
      <div class="week-name">日</div>
      <div class="week-name">一</div>
      <div class="week-name">二</div>
      <div class="week-name">三</div>
      <div class="week-name">四</div>
      <div class="week-name">五</div>
      <div class="week-name">六</div>
    </div>
    <div id="calendarBody" class="day-row"></div>
  </div>
</div>

<!-- 备忘编辑弹窗 -->
<div class="modal-mask" id="memoModal">
  <div class="modal-box">
    <div class="modal-title" id="memoModalTitle">新增备忘</div>
    <input type="text" id="memoDate" placeholder="日期 YYYY-MM-DD">
    <textarea id="memoContent" rows="6" placeholder="输入备忘内容，可粘贴图片链接"></textarea>
    <!-- 图片上传组件 -->
    <div style="margin:10px 0;">
      <input type="file" id="imgUploadInput" accept="image/*" style="display:none;">
      <button onclick="document.getElementById('imgUploadInput').click()" class="btn">📷 上传图片（手机唤起相册）</button>
      <div id="uploadTip" style="margin-top:6px;color:#666;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeMemoModal()">取消</button>
      <button class="btn" onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<!-- 备忘查看/编辑弹窗 -->
<div class="modal-mask" id="viewModal">
  <div class="modal-box">
    <div class="modal-title" id="viewTitle">备忘详情</div>
    <div id="viewContent" style="line-height:1.7;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="deleteMemo()">删除</button>
      <button class="btn" onclick="editMemoFromView()">编辑</button>
      <button class="btn btn-secondary" onclick="closeViewModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingModal">
  <div class="modal-box">
    <div class="modal-title">设置（Gist 同步）</div>
    <div>Token</div>
    <input type="text" id="cfgToken">
    <div>Gist ID</div>
    <input type="text" id="cfgGistId">
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeSettingModal()">取消</button>
      <button class="btn" onclick="saveConfig()">保存设置</button>
    </div>
  </div>
</div>

<script>
// ========== 全局配置 ==========
const imgRepoOwner = "figo-git";
const imgRepoName = "img-storage";
const imgBranch = "main";

let state = {
  memos: [],
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth()
};
let config = {
  token: "",
  gistId: ""
};
const STORAGE_KEY = "memo_calendar_config";

let editingId = null;   // 正在编辑的备忘 id
let viewingId = null;   // 正在查看的备忘 id

// 页面加载初始化
loadLocalConfig();
renderCalendar();
pullGist();

// ========== 图片上传模块 ==========
async function compressImage(file, maxWidth = 1200, quality = 0.7) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width;
        let h = img.height;
        if (w > maxWidth) {
          h = h * (maxWidth / w);
          w = maxWidth;
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadImageToRepo(blob) {
  const filename = `img_${Date.now()}.jpg`;
  const filePath = `images/${filename}`;
  const base64 = await new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
  const res = await fetch(`https://api.github.com/repos/${imgRepoOwner}/${imgRepoName}/contents/${filePath}`, {
    method: "PUT",
    headers: {
      "Authorization": `token ${config.token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: `upload image ${filename}`,
      content: base64,
      branch: imgBranch
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || "上传图片失败");
  }
  return `https://cdn.jsdelivr.net/gh/${imgRepoOwner}/${imgRepoName}@${imgBranch}/${filePath}`;
}

document.getElementById("imgUploadInput").addEventListener("change", async function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const tipDom = document.getElementById("uploadTip");
  tipDom.textContent = "正在压缩并上传图片...";
  try {
    const compressedBlob = await compressImage(file);
    const url = await uploadImageToRepo(compressedBlob);
    tipDom.textContent = "✅ 上传成功";
    document.getElementById("memoContent").value += `\n![图片](${url})`;
  } catch (err) {
    tipDom.textContent = "❌ 上传失败：" + err.message;
    console.error(err);
  }
  e.target.value = "";
});

// ========== 备忘内容渲染：解析图片 Markdown ==========
function renderMemoContent(text) {
  let html = (text || "").replace(/!\[图片\]\((.+?)\)/g,
    `<img src="$1" style="max-width:100%;border-radius:6px;margin:4px 0;" onclick="window.open('$1')">`);
  html = html.replace(/\n/g, "<br>");
  return html;
}

// ========== 本地存储读写 ==========
function loadLocalConfig() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    config = JSON.parse(raw);
    state.memos = config.memos || [];
    document.getElementById("cfgToken").value = config.token || "";
    document.getElementById("cfgGistId").value = config.gistId || "";
  }
}
function saveLocalConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...config, memos: state.memos }));
}

// ========== Gist 同步逻辑（云端优先合并） ==========
async function pullGist() {
  if (!config.token || !config.gistId) {
    setSyncStatus("请先填写 Token 和 Gist ID");
    return;
  }
  setSyncStatus("拉取云端数据...");
  try {
    const res = await fetch(`https://api.github.com/gists/${config.gistId}`, {
      headers: { "Authorization": `token ${config.token}` }
    });
    const gist = await res.json();
    if (!res.ok) throw new Error(gist.message);
    const file = gist.files["memos.json"];
    let remoteMemos = [];
    if (file) {
      const remoteData = JSON.parse(file.content);
      remoteMemos = remoteData.memos || [];
    }
    // 云端优先合并：相同 id 时以云端 updateAt 为准；本地独有的记录保留
    const localMap = {};
    state.memos.forEach(item => { localMap[item.id] = item; });
    const finalList = [];
    remoteMemos.forEach(remoteItem => {
      const localItem = localMap[remoteItem.id];
      if (!localItem) {
        finalList.push(remoteItem);
      } else {
        finalList.push(
          (remoteItem.updateAt >= localItem.updateAt) ? remoteItem : localItem
        );
        delete localMap[remoteItem.id];
      }
    });
    Object.values(localMap).forEach(leftover => finalList.push(leftover));
    state.memos = finalList;
    saveLocalConfig();
    renderCalendar();
    setSyncStatus(`[同步] 云端优先拉取完成，共 ${state.memos.length} 条备忘`);
  } catch (e) {
    setSyncStatus("拉取失败：" + e.message);
    console.error(e);
  }
}

async function pushGist() {
  if (!config.token || !config.gistId) return false;
  setSyncStatus("推送数据到 Gist...");
  try {
    const res = await fetch(`https://api.github.com/gists/${config.gistId}`, {
      method: "PATCH",
      headers: {
        "Authorization": `token ${config.token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        description: "Memo Calendar Data (Auto-created)",
        files: {
          "memos.json": {
            content: JSON.stringify({ memos: state.memos }, null, 2)
          }
        }
      })
    });
    const ret = await res.json();
    if (!res.ok) throw new Error(ret.message);
    setSyncStatus(`[同步] 推送成功，共 ${state.memos.length} 条备忘`);
    saveLocalConfig();
    return true;
  } catch (e) {
    setSyncStatus("推送失败：" + e.message);
    console.error(e);
    return false;
  }
}

async function pullPushSync() {
  await pullGist();
  await pushGist();
}

// ========== 日历渲染 ==========
function renderCalendar() {
  const y = state.currentYear;
  const m = state.currentMonth;
  document.getElementById("monthTitle").innerText =
    `${y}-${String(m + 1).padStart(2, "0")}`;
  const firstDay = new Date(y, m, 1).getDay();
  const daysCount = new Date(y, m + 1, 0).getDate();
  const wrap = document.getElementById("calendarBody");
  wrap.innerHTML = "";
  for (let i = 0; i < firstDay; i++) {
    const d = document.createElement("div");
    d.className = "day-cell";
    wrap.appendChild(d);
  }
  for (let d = 1; d <= daysCount; d++) {
    const cell = document.createElement("div");
    cell.className = "day-cell";
    const dateStr =
      `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    cell.innerText = d;
    const dayMemos = state.memos.filter(item => item.date === dateStr);
    if (dayMemos.length > 0) cell.classList.add("has-memo");
    cell.onclick = () => {
      if (dayMemos.length === 0) {
        openMemoModal(dateStr);
      } else if (dayMemos.length === 1) {
        openViewModal(dayMemos[0].id);
      } else {
        openMemoModal(dateStr);
      }
    };
    wrap.appendChild(cell);
  }
}

function prevMonth() {
  state.currentMonth--;
  if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
  renderCalendar();
}
function nextMonth() {
  state.currentMonth++;
  if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
  renderCalendar();
}

// ========== 备忘编辑弹窗 ==========
function openMemoModal(dateStr) {
  editingId = null;
  document.getElementById("memoModalTitle").innerText = "新增备忘";
  document.getElementById("memoDate").value = dateStr ||
    `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, "0")}-01`;
  document.getElementById("memoContent").value = "";
  document.getElementById("uploadTip").textContent = "";
  document.getElementById("memoModal").style.display = "flex";
}
function closeMemoModal() {
  document.getElementById("memoModal").style.display = "none";
}
function saveMemo() {
  const date = document.getElementById("memoDate").value.trim();
  const content = document.getElementById("memoContent").value;
  if (!date) return alert("请填写日期");
  if (editingId) {
    const idx = state.memos.findIndex(x => x.id === editingId);
    if (idx >= 0) {
      state.memos[idx].date = date;
      state.memos[idx].content = content;
      state.memos[idx].updateAt = Date.now();
    }
  } else {
    state.memos.push({
      id: Date.now().toString(),
      date,
      content,
      updateAt: Date.now()
    });
  }
  saveLocalConfig();
  closeMemoModal();
  renderCalendar();
}

// ========== 备忘查看弹窗 ==========
function openViewModal(id) {
  const item = state.memos.find(x => x.id === id);
  if (!item) return;
  viewingId = id;
  document.getElementById("viewTitle").innerText = `备忘 · ${item.date}`;
  document.getElementById("viewContent").innerHTML = renderMemoContent(item.content);
  document.getElementById("viewModal").style.display = "flex";
}
function closeViewModal() {
  document.getElementById("viewModal").style.display = "none";
  viewingId = null;
}
function editMemoFromView() {
  const item = state.memos.find(x => x.id === viewingId);
  if (!item) return;
  closeViewModal();
  editingId = item.id;
  document.getElementById("memoModalTitle").innerText = "编辑备忘";
  document.getElementById("memoDate").value = item.date;
  document.getElementById("memoContent").value = item.content;
  document.getElementById("uploadTip").textContent = "";
  document.getElementById("memoModal").style.display = "flex";
}
function deleteMemo() {
  if (!viewingId) return;
  if (!confirm("确定删除这条备忘吗？")) return;
  state.memos = state.memos.filter(x => x.id !== viewingId);
  saveLocalConfig();
  closeViewModal();
  renderCalendar();
}

// ========== 设置弹窗 ==========
function openSettingModal() {
  document.getElementById("settingModal").style.display = "flex";
}
function closeSettingModal() {
  document.getElementById("settingModal").style.display = "none";
}
function saveConfig() {
  config.token = document.getElementById("cfgToken").value.trim();
  config.gistId = document.getElementById("cfgGistId").value.trim();
  saveLocalConfig();
  closeSettingModal();
  alert("设置保存成功");
  pullGist();
}
function setSyncStatus(text) {
  document.getElementById("syncStatus").innerText = text;
}
</script>
</body>
</html>
