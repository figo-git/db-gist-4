<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: #f4f7fa; padding: 12px; }
    .app-container { max-width: 900px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-bar h1 { font-size: 20px; }
    .btn { padding: 8px 14px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #6b7280; }
    .calendar-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px #00000012;
      overflow: hidden;
      position: relative;
    }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
    .week-name { text-align: center; font-size: 13px; color: #666; padding: 4px; }
    .calendar-viewport {
      overflow: hidden;
      position: relative;
    }
    .day-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
      transform-origin: top center;
      will-change: transform;
    }
    .day-cell {
      aspect-ratio: 1/1;
      border-radius: 8px;
      padding: 4px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #eee;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .day-cell:active { transform: scale(0.96); }
    .day-cell .day-num {
      line-height: 1;
      font-weight: 500;
      font-size: 15px;
    }
    .day-cell .fest-jieqi-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #b45309;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .day-cell .lunar-row {
      font-size: 9px;
      color: #94a3b8;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: auto;
    }
    .day-cell .fest-icon {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 12px;
      line-height: 1;
    }
    .day-cell.festival {
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      border-color: #f59e0b;
    }
    .day-cell.festival .fest-jieqi-row {
      color: #9a3412;
    }
    .day-cell.jieqi {
      background: linear-gradient(135deg, #ecfccb, #d9f99d);
      border-color: #84cc16;
    }
    .day-cell.jieqi .fest-jieqi-row {
      color: #3f6212;
    }
    .day-cell.today {
      border-color: #2563eb;
      background: linear-gradient(145deg, #dbeafe, #eff6ff);
      box-shadow:
        0 10px 20px rgba(37, 99, 235, 0.35),
        0 4px 8px rgba(37, 99, 235, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }
    .day-cell.today .day-num {
      color: #1d4ed8;
      font-weight: 700;
    }
    .day-cell.has-memo::after {
      content: "";
      width: 10px;
      height: 10px;
      background: #64748b;
      border-radius: 50%;
      position: absolute;
      bottom: 5px;
      right: 5px;
      box-shadow: 0 0 0 2px #fff;
    }
    .day-cell.has-important::after {
      background: #ef4444;
      width: 13px;
      height: 13px;
      bottom: 4px;
      right: 4px;
      box-shadow: 0 0 0 2px #fff, 0 0 6px #ef4444;
    }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 99; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
      padding: 16px;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .modal-box::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:12px;
      background:rgba(255,255,255,0.88);
      z-index:-1;
    }
    .modal-title { font-size: 18px; margin-bottom: 12px; }
    textarea, input[type=text], select { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 16px; margin: 8px 0; background: #fff; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    .tip-text { font-size: 13px; color: #555; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 8px; vertical-align: middle; }
    .badge-important { background: #fee2e2; color: #dc2626; }
    .badge-normal { background: #e2e8f0; color: #475569; }
    .badge-holiday { background: #fef3c7; color: #b45309; }

    .badge-weather { background: #dbeafe; color: #1d4ed8; }
    .row-label { font-size: 13px; color: #666; margin-top: 8px; }
  </style>
</head>

<div class="modal-mask" id="memoModal">

    <div class="modal-title" id="memoModalTitle">新增备忘</div>

let editingId = null, viewingId = null, isSyncing = false, isUploading = false;

const calendarWrapDom = document.getElementById("calendarWrap");
const calendarBodyDom = document.getElementById("calendarBody");

// 手势状态：区分单指滑动月份切换与双指缩放
let touchStartX = 0;
let touchMovedX = 0;
let touchStartY = 0;
let isPinching = false;
let initialPinchDistance = 0;
let currentScale = 1;
const MIN_SCALE = 1;
const MAX_SCALE = 1.4;
const SWIPE_THRESHOLD = 60;
const SWIPE_HORIZONTAL_RATIO = 1.2;
calendarWrapDom.addEventListener("touchstart", function (e) {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].screenX;
    touchStartY = e.touches[0].screenY;
    touchMovedX = 0;
    isPinching = false;
  } else if (e.touches.length === 2) {
    isPinching = true;
    initialPinchDistance = getDistance(e.touches);
  }
}, { passive: true });
calendarWrapDom.addEventListener("touchmove", function (e) {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const currentDistance = getDistance(e.touches);
    const scale = currentDistance / initialPinchDistance;
    let newScale = currentScale * scale;
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    calendarBodyDom.style.transform = `scale(${newScale})`;
    currentScale = newScale;
    return;
  }
  if (e.touches.length === 1 && !isPinching) {
    const dx = e.touches[0].screenX - touchStartX;
    const dy = e.touches[0].screenY - touchStartY;
    // 只有横向明显大于纵向时才作为月份切换手势，减少缩放误判
    if (Math.abs(dx) > Math.abs(dy) * SWIPE_HORIZONTAL_RATIO) {
      touchMovedX = dx;
      calendarBodyDom.style.transition = "none";
      calendarBodyDom.style.transform = `translateX(${dx}px)`;
    }
  }
}, { passive: false });
calendarWrapDom.addEventListener("touchend", function (e) {
  if (isPinching) {
    currentScale = Math.round(currentScale * 10) / 10;
    calendarBodyDom.style.transform = `scale(${currentScale})`;
    isPinching = false;
    return;
  }
  if (e.touches.length === 0 && touchMovedX !== 0) {
    if (touchMovedX > SWIPE_THRESHOLD) {
      prevMonth(true);
    } else if (touchMovedX < -SWIPE_THRESHOLD) {
      nextMonth(true);
    } else {
      resetCalendarPosition();
    }
    touchMovedX = 0;
  }
}, { passive: true });
function getDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}
function resetCalendarPosition() {
  calendarBodyDom.style.transition = "transform 0.25s ease";
  calendarBodyDom.style.transform = `translateX(0) scale(${currentScale})`;
}
// 月份切换：带动画过程
function prevMonth(withSwipe = false) {
  if (withSwipe) {
    calendarBodyDom.style.transition = "transform 0.35s ease";
    calendarBodyDom.style.transform = `translateX(100%) scale(${currentScale})`;
  }
  state.currentMonth--;
  if (state.currentMonth < 0) {
    state.currentMonth = 11;
    state.currentYear--;
  }
  setTimeout(() => {
    renderCalendar();
    loadWeatherForWeek(state.currentYear, state.currentMonth);
  }, withSwipe ? 320 : 0);
}
function nextMonth(withSwipe = false) {
  if (withSwipe) {
    calendarBodyDom.style.transition = "transform 0.35s ease";
    calendarBodyDom.style.transform = `translateX(-100%) scale(${currentScale})`;
  }
  state.currentMonth++;
  if (state.currentMonth > 11) {
    state.currentMonth = 0;
    state.currentYear++;
  }
  setTimeout(() => {
    renderCalendar();
    loadWeatherForWeek(state.currentYear, state.currentMonth);
  }, withSwipe ? 320 : 0);
}

const SOLAR_HOLIDAYS = {
  "01-01": "元旦", "02-14": "情人节", "03-08": "妇女节", "03-12": "植树节",
  "05-01": "劳动节", "05-04": "青年节", "06-01": "儿童节",

};
const LUNAR_HOLIDAYS = {
  "1-1": "春节", "1-15": "元宵节", "5-5": "端午节", "7-7": "七夕",
  "7-15": "中元节", "8-15": "中秋节", "9-9": "重阳节", "12-8": "腊八节",
  "12-23": "小年", "12-30": "除夕"
};
function getDayInfo(y, m, d) {
  const info = { lunar: "", holiday: null, jieqi: null, isToday: false };
  const today = new Date();
  if (y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate()) info.isToday = true;
  try {
    const solar = Solar.fromYmd(y, m, d);
    const lunar = solar.getLunar();
    const jq = lunar.getJieQi();
    if (jq) info.jieqi = jq;
    const lm = lunar.getMonth(), ld = lunar.getDay();
    const lunarKey = `${lm}-${ld}`;
    if (LUNAR_HOLIDAYS[lunarKey]) {
      info.holiday = LUNAR_HOLIDAYS[lunarKey];
      info.lunar = LUNAR_HOLIDAYS[lunarKey];
    } else if (SOLAR_HOLIDAYS[`${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`]) {
      info.holiday = SOLAR_HOLIDAYS[`${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`];
      info.lunar = info.holiday;
    } else if (info.jieqi) {
      info.lunar = info.jieqi;
    } else {
      info.lunar = ld === 1 ? lunar.getMonthInChinese() + "月" : lunar.getDayInChinese();
    }
  } catch (e) { info.lunar = ""; }
  return info;
}
function weatherCodeToIcon(code) {
  if (code === 0) return { icon: "☀️", text: "晴", cls: "w-sun" };
  if (code <= 2) return { icon: "⛅", text: "多云", cls: "w-cloud" };
  if (code === 3) return { icon: "☁️", text: "阴", cls: "w-cloud" };
  if (code <= 48) return { icon: "🌫️", text: "雾", cls: "w-cloud" };
  if (code <= 67) return { icon: "🌧️", text: "雨", cls: "w-rain" };
  if (code <= 77) return { icon: "🌨️", text: "雪", cls: "w-snow" };
  if (code <= 82) return { icon: "🌦️", text: "阵雨", cls: "w-rain" };
  if (code <= 86) return { icon: "🌨️", text: "阵雪", cls: "w-snow" };
  return { icon: "🌡️", text: "", cls: "w-cloud" };
}
// 只显示最近一周天气
async function loadWeatherForWeek(y, m) {
  try {
    const today = new Date();
    const weekLater = new Date();
    weekLater.setDate(today.getDate() + 6);
    const start = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    const end = `${weekLater.getFullYear()}-${String(weekLater.getMonth() + 1).padStart(2,"0")}-${String(weekLater.getDate()).padStart(2,"0")}`;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${start}&end_date=${end}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.daily && data.daily.time) {
      data.daily.time.forEach((dateStr, i) => {
        const w = weatherCodeToIcon(data.daily.weathercode[i]);
        const tMax = Math.round(data.daily.temperature_2m_max[i]);
        const tMin = Math.round(data.daily.temperature_2m_min[i]);
        weatherCache[dateStr] = { ...w, text: `${w.icon}${tMin}~${tMax}°` };
      });
    }
  } catch (e) {
    console.warn("天气加载失败", e);
  }
}
/**
 * 设置弹窗背景图：优先取节日/节气对应网络图片，没有就清空为默认白色
 */
function applyModalBgImage(modalBox, holiday, jieqi){
  modalBox.style.backgroundImage="";
  let key = holiday || jieqi;
  if(key && FESTIVAL_JIEQI_BG_IMAGE[key]){
    modalBox.style.backgroundImage = `url(${FESTIVAL_JIEQI_BG_IMAGE[key]})`;
  }
}
function applyUrlConfig() {
  const params = new URLSearchParams(window.location.search);
  const gistid = params.get("gistid");
  const token = params.get("token");
  if (gistid) config.gistId = gistid.trim();
  if (token) config.token = token.trim();
  if (gistid || token) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...config, memos: state.memos }));
    setSyncStatus("已从链接自动填入配置");
  }
}
function loadLocalConfig() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { config = JSON.parse(raw); state.memos = config.memos || []; }
}
loadLocalConfig();
applyUrlConfig();
renderCalendar();
pullGist();
loadWeatherForWeek(state.currentYear, state.currentMonth);
async function compressImage(file, maxWidth = 1200, quality = 0.7) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = h * (maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadImageToRepo(blob) {
  const filename = `img_${Date.now()}.jpg`;
  const filePath = `images/${filename}`;
  const base64 = await new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
  const res = await fetch(`https://api.github.com/repos/${imgRepoOwner}/${imgRepoName}/contents/${filePath}`, {
    method: "PUT",
    headers: { "Authorization": `token ${config.token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message: `upload image ${filename}`, content: base64, branch: imgBranch })
  });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || "上传图片失败"); }
  return `https://cdn.jsdelivr.net/gh/${imgRepoOwner}/${imgRepoName}@${imgBranch}/${filePath}`;
}
document.getElementById("imgUploadInput").addEventListener("change", async function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const tipDom = document.getElementById("uploadTip");
  if (isUploading) { tipDom.textContent = "正在上传中，请稍候"; return; }
  isUploading = true;
  tipDom.textContent = "正在压缩并上传图片...";
  try {
    const compressedBlob = await compressImage(file);
    const url = await uploadImageToRepo(compressedBlob);
    tipDom.textContent = "✅ 上传成功";
    document.getElementById("memoContent").value += `\n![图片](${url})`;
  } catch (err) {
    tipDom.textContent = "❌ 上传失败：" + err.message;
    console.error(err);
  } finally { isUploading = false; e.target.value = ""; }
});
function renderMemoContent(text) {
  let html = (text || "").replace(/!\[图片\]\((.+?)\)/g,
    `<img src="$1" style="max-width:100%;border-radius:6px;margin:4px 0;" onclick="window.open('$1')">`);
  return html.replace(/\n/g, "<br>");
}
function saveLocalConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...config, memos: state.memos }));
}
async function pullGist() {
  if (!config.token || !config.gistId) { setSyncStatus("请通过配置链接打开"); return; }
  if (isSyncing) return;
  isSyncing = true;
  setSyncStatus("拉取云端数据...");
  try {
    const res = await fetch(`https://api.github.com/gists/${config.gistId}`, { headers: { "Authorization": `token ${config.token}` } });
    const gist = await res.json();
    if (!res.ok) throw new Error(gist.message);
    const file = gist.files["memos.json"];
    let remoteMemos = [];
    if (file) { const rd = JSON.parse(file.content); remoteMemos = rd.memos || []; }
    const localMap = {};
    state.memos.forEach(item => { localMap[item.id] = item; });
    const finalList = [];
    remoteMemos.forEach(ri => {
      const li = localMap[ri.id];
      if (!li) finalList.push(ri);
      else { finalList.push(ri.updateAt >= li.updateAt ? ri : li); delete localMap[ri.id]; }
    });
    Object.values(localMap).forEach(x => finalList.push(x));
    state.memos = finalList;
    saveLocalConfig();
    renderCalendar();
    setSyncStatus(`[同步] 拉取完成，共 ${state.memos.length} 条备忘`);
  } catch (e) {
    setSyncStatus("拉取失败：" + e.message);
    console.error(e);
  } finally { isSyncing = false; }
}
async function pushGist() {
  if (!config.token || !config.gistId) return false;
  setSyncStatus("推送数据到 Gist...");
  try {
    const res = await fetch(`https://api.github.com/gists/${config.gistId}`, {
      method: "PATCH",
      headers: { "Authorization": `token ${config.token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ description: "Memo Calendar", files: { "memos.json": { content: JSON.stringify({ memos: state.memos }, null, 2) } } })
    });
    const ret = await res.json();
    if (!res.ok) throw new Error(ret.message);
    setSyncStatus(`[同步] 推送成功，共 ${state.memos.length} 条备忘`);
    saveLocalConfig();
    return true;
  } catch (e) {
    setSyncStatus("推送失败：" + e.message);
    console.error(e);
    return false;
  }
}
async function pullPushSync() { await pullGist(); await pushGist(); }
function renderCalendar() {
  const y = state.currentYear, m = state.currentMonth;
  document.getElementById("monthTitle").innerText = `${y}-${String(m + 1).padStart(2, "0")}`;
  const firstDay = new Date(y, m, 1).getDay();
  const daysCount = new Date(y, m + 1, 0).getDate();
  const wrap = document.getElementById("calendarBody");
  // 先把位置复位，再重绘当月
  calendarBodyDom.style.transition = "none";
  calendarBodyDom.style.transform = `translateX(0) scale(${currentScale})`;
  wrap.innerHTML = "";
  for (let i = 0; i < firstDay; i++) { const d = document.createElement("div"); d.className = "day-cell"; wrap.appendChild(d); }
  for (let d = 1; d <= daysCount; d++) {
    const cell = document.createElement("div");
    cell.className = "day-cell";
    const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const info = getDayInfo(y, m + 1, d);
    if (info.isToday) cell.classList.add("today");
    const festIcon = info.holiday ? (FESTIVAL_ICON[info.holiday] || "🎉") : "";
    let festJieqiText = "";
    let isFestOrJieqi = false;
    if (info.holiday) {
      cell.classList.add("festival");
      festJieqiText = info.holiday;
      isFestOrJieqi = true;
    } else if (info.jieqi) {
      cell.classList.add("jieqi");
      festJieqiText = info.jieqi;
      isFestOrJieqi = true;
    }
    // =========需求1：节日/节气格子不渲染农历lunar-row；普通日期保留农历=========
    let lunarHtml = "";
    if(!isFestOrJieqi && info.lunar){
      lunarHtml = `<span class="lunar-row">${info.lunar}</span>`;
    }
    cell.innerHTML = `
<span class="day-num">${d}</span>
${festIcon ? `<span class="fest-icon">${festIcon}</span>` : ""}
<span class="fest-jieqi-row">${festJieqiText}</span>
${lunarHtml}
`;
    const dayMemos = state.memos.filter(item => item.date === dateStr);
    if (dayMemos.length > 0) {
      cell.classList.add("has-memo");
      if (dayMemos.some(x => x.priority === "important")) cell.classList.add("has-important");
    }
    cell.onclick = () => {
      if (dayMemos.length === 0) openMemoModal(dateStr);
      else if (dayMemos.length === 1) openViewModal(dayMemos[0].id);
      else openMemoModal(dateStr);
    };
    wrap.appendChild(cell);
  }
}
function openMemoModal(dateStr) {
  editingId = null;
  document.getElementById("memoModalTitle").innerText = "新增备忘";
  document.getElementById("memoDate").value = dateStr || `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, "0")}-01`;
  document.getElementById("memoPriority").value = "normal";
  document.getElementById("memoContent").value = "";
  document.getElementById("uploadTip").textContent = "";
  const [y, m, d] = (dateStr || "").split("-").map(Number);
  const info = y ? getDayInfo(y, m, d) : { holiday: null, jieqi: null };
  const weatherInfo = weatherCache[dateStr];
  const weatherBox = document.getElementById("memoWeatherInfo");
  if (weatherInfo) {
    weatherBox.innerHTML = `<span class="badge badge-weather">${weatherInfo.text}</span>`;
  } else {
    weatherBox.innerHTML = `<span style="color:#888;">今日天气暂未收录，仅显示最近一周天气</span>`;
  }
  applyModalBgImage(document.getElementById("memoModalBox"), info.holiday, info.jieqi);
  document.getElementById("memoModal").style.display = "flex";
}
function closeMemoModal() { document.getElementById("memoModal").style.display = "none"; }
function saveMemo() {
  const date = document.getElementById("memoDate").value.trim();
  const content = document.getElementById("memoContent").value;
  const priority = document.getElementById("memoPriority").value;
  if (!date) return alert("请填写日期");
  if (editingId) {
    const idx = state.memos.findIndex(x => x.id === editingId);
    if (idx >= 0) { state.memos[idx].date = date; state.memos[idx].content = content; state.memos[idx].priority = priority; state.memos[idx].updateAt = Date.now(); }
  } else {
    state.memos.push({ id: Date.now().toString(), date, content, priority, updateAt: Date.now() });
  }
  saveLocalConfig(); closeMemoModal(); renderCalendar();
}
function openViewModal(id) {
  const item = state.memos.find(x => x.id === id);
  if (!item) return;
  viewingId = id;
  const badge = item.priority === "important" ? `<span class="badge badge-important">重要</span>` : `<span class="badge badge-normal">普通</span>`;
  document.getElementById("viewTitle").innerHTML = `备忘 · ${item.date} ${badge}`;
  const [y, m, d] = item.date.split("-").map(Number);
  const info = getDayInfo(y, m, d);
  let dateInfo = "";
  if (info.holiday) dateInfo += `<span class="badge badge-holiday">${info.holiday} ${FESTIVAL_ICON[info.holiday] || ""}</span>`;
  if (info.jieqi) dateInfo += `<span class="badge badge-jieqi">${info.jieqi}</span>`;
  if (weatherCache[item.date]) dateInfo += `<span class="badge badge-weather">${weatherCache[item.date].text}</span>`;
  document.getElementById("viewDateInfo").innerHTML = dateInfo;
  document.getElementById("viewContent").innerHTML = renderMemoContent(item.content);
  applyModalBgImage(document.getElementById("viewModalBox"), info.holiday, info.jieqi);
  document.getElementById("viewModal").style.display = "flex";
}
function closeViewModal() { document.getElementById("viewModal").style.display = "none"; viewingId = null; }
function editMemoFromView() {
  const item = state.memos.find(x => x.id === viewingId);
  if (!item) return;
  closeViewModal();
  editingId = item.id;
  document.getElementById("memoModalTitle").innerText = "编辑备忘";
  document.getElementById("memoDate").value = item.date;
  document.getElementById("memoPriority").value = item.priority || "normal";
  document.getElementById("memoContent").value = item.content;
  document.getElementById("uploadTip").textContent = "";
  const [y, m, d] = item.date.split("-").map(Number);
  const info = getDayInfo(y, m, d);
  const weatherInfo = weatherCache[item.date];
  const weatherBox = document.getElementById("memoWeatherInfo");
  if (weatherInfo) {
    weatherBox.innerHTML = `<span class="badge badge-weather">${weatherInfo.text}</span>`;
  } else {
    weatherBox.innerHTML = `<span style="color:#888;">今日天气暂未收录</span>`;
  }
  applyModalBgImage(document.getElementById("memoModalBox"), info.holiday, info.jieqi);
  document.getElementById("memoModal").style.display = "flex";
}
function deleteMemo() {
  if (!viewingId) return;
  if (!confirm("确定删除这条备忘吗？")) return;
  state.memos = state.memos.filter(x => x.id !== viewingId);
  saveLocalConfig(); closeViewModal(); renderCalendar();
}
function setSyncStatus(text) { document.getElementById("syncStatus").innerText = text; }
</script>
