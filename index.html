<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备忘录日历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 1020px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .app-header {
            background: linear-gradient(135deg, #4b78e8 0%, #805ad5 100%);
            color: white;
            padding: 24px;
        }
        .app-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .status-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-error {background: #f56565;}
        .status-success {background: #48bb78;}
        .status-wait {background: #ecc94b;}
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-light {
            background: rgba(255,255,255,0.22);
            color: white;
        }
        .btn-light:hover {
            background: rgba(255,255,255,0.3);
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .nav-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size:15px;
            cursor: pointer;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .calendar-wrap {
            background: #ffffff;
            padding:24px;
        }
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom:12px;
        }
        .week-cell {
            text-align:center;
            font-weight:500;
            color:#4b78e8;
            font-size:15px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap:10px;
        }
        .day-cell {
            aspect-ratio: 1 / 1;
            border:1px solid #e2e8f0;
            border-radius:10px;
            padding: 8px;
            cursor: pointer;
            position: relative;
            display:flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background .15s;
        }
        .day-cell:hover {
            background-color: #f7fafc;
        }
        .day-cell.today {
            background: linear-gradient(135deg, #4b78e8 0%, #805ad5 100%);
            color:white;
            border-color:#4b78e8;
        }
        .day-num {
            font-size:16px;
        }
        .mark-wrap {
            display:flex;
            gap:3px;
            justify-content: flex-end;
            align-items: flex-end;
        }
        .mark-important {
            width:8px;
            height:8px;
            border-radius:50%;
            background:#f56565;
        }
        .mark-normal {
            width:8px;
            height:8px;
            border-radius:50%;
            background:#4299e1;
        }
        /* 弹窗 */
        .modal-mask {
            position: fixed;
            inset:0;
            background:rgba(0,0,0,0.45);
            display:none;
            align-items:center;
            justify-content:center;
            z-index: 99;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background:#fff;
            border-radius:14px;
            width: min(92%,520px);
            max-height: 90vh;
            overflow-y: auto;
            padding:24px;
        }
        .modal h3 {
            margin-bottom:16px;
        }
        .form-item {
            margin-bottom:14px;
        }
        .form-item label {
            display:block;
            margin-bottom:6px;
            font-weight:500;
            font-size: 14px;
        }
        textarea, select, input {
            width:100%;
            border:1px solid #cbd5e0;
            border-radius:8px;
            padding:10px;
            font-size:15px;
            font-family: inherit;
        }
        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: #4b78e8;
        }
        .modal-footer {
            display:flex;
            gap:10px;
            justify-content:flex-end;
            margin-top:18px;
        }
        /* 备忘列表 */
        .memo-list {
            margin:16px 0;
            max-height:240px;
            overflow-y:auto;
        }
        .memo-item {
            padding:10px;
            border-radius:8px;
            border:1px solid #e2e8f0;
            margin-bottom:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap: 10px;
        }
        .memo-item.important {
            border-left:4px solid #f56565;
        }
        .memo-item.normal {
            border-left:4px solid #4299e1;
        }
        .memo-ops { flex-shrink: 0; }
        .memo-ops button {
            border:none;
            background:none;
            color:#4b78e8;
            cursor:pointer;
            margin-left:8px;
            font-size: 13px;
        }
        .memo-ops button:hover { text-decoration: underline; }
        .memo-ops .del-btn { color: #e53e3e; }
        .empty-tip {
            text-align: center;
            color: #a0aec0;
            padding: 20px 0;
            font-size: 14px;
        }
        .form-hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
            line-height: 1.5;
        }
        .form-hint a { color: #4b78e8; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="app-title">备忘录日历</div>
            <div class="status-bar">
                <div class="status-text">
                    <span class="status-dot status-error" id="syncDot"></span>
                    <span id="syncText">未配置同步</span>
                </div>
                <div class="header-buttons">
                    <button class="btn btn-light" id="syncBtn">立即同步</button>
                    <button class="btn btn-light" id="settingBtn">设置</button>
                </div>
            </div>
            <div class="calendar-nav">
                <button class="nav-btn" id="prevMonth">上月</button>
                <h2 id="monthTitle">2026年9月</h2>
                <button class="nav-btn" id="nextMonth">下月</button>
            </div>
        </div>
        <div class="calendar-wrap">
            <div class="week-header">
                <div class="week-cell">日</div>
                <div class="week-cell">一</div>
                <div class="week-cell">二</div>
                <div class="week-cell">三</div>
                <div class="week-cell">四</div>
                <div class="week-cell">五</div>
                <div class="week-cell">六</div>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <!-- 备忘编辑弹窗 -->
    <div class="modal-mask" id="memoModal">
        <div class="modal">
            <h3 id="memoModalTitle">添加备忘</h3>
            <input type="hidden" id="editDate">
            <input type="hidden" id="editId">
            <div class="form-item">
                <label>备忘内容</label>
                <textarea id="memoContent" rows="3" placeholder="输入备忘内容..."></textarea>
            </div>
            <div class="form-item">
                <label>优先级</label>
                <select id="memoPriority">
                    <option value="normal">普通（蓝色标记）</option>
                    <option value="important">重要（红色标记）</option>
                </select>
            </div>
            <div class="memo-list" id="memoListWrap"></div>
            <div class="modal-footer">
                <button class="btn" id="closeMemoModal" style="background:#edf2f7;">取消</button>
                <button class="btn btn-light" id="saveMemo" style="background:#4b78e8;">保存</button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-mask" id="settingModal">
        <div class="modal">
            <h3>Gist 同步设置</h3>
            <div class="form-item">
                <label>GitHub Token（需勾选 gist 权限）</label>
                <input type="password" id="gistToken" placeholder="ghp_xxxxxxxxxxxx">
                <div class="form-hint">
                    到 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">GitHub Token 设置页</a> 生成，勾选 gist 权限即可。
                </div>
            </div>
            <div class="form-item">
                <label>Gist ID（留空自动查找）</label>
                <input type="text" id="gistId" placeholder="留空则自动查找已有备忘 Gist">
                <div class="form-hint">首次使用留空，系统会自动创建或复用已有 Gist。</div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="closeSettingModal" style="background:#edf2f7;">取消</button>
                <button class="btn btn-light" id="saveSetting" style="background:#4b78e8;">保存并同步</button>
            </div>
        </div>
    </div>

<script>
const STORAGE_KEY = "memo_calendar_config_v2";
const MEMOS_KEY = "memo_calendar_data_v2";
const FILE_NAME = "memos.json";
const GIST_API = "https://api.github.com";

let state = {
    memos: {},
    config: { token: "", gistId: "" },
    currentDate: new Date(),
    syncTimer: null,
    pollTimer: null
};

function loadLocal() {
    try {
        const cfg = localStorage.getItem(STORAGE_KEY);
        if (cfg) state.config = JSON.parse(cfg);
        const memosRaw = localStorage.getItem(MEMOS_KEY);
        if (memosRaw) state.memos = JSON.parse(memosRaw);
        // 兼容旧版数据：v1 的 text/updatedAt → v2 的 content/updateAt，补默认 priority
        migrateData(state.memos);
    } catch(e) { console.warn(e); }
    document.getElementById("gistToken").value = state.config.token;
    document.getElementById("gistId").value = state.config.gistId;
}

/* 旧版数据迁移：text→content, updatedAt→updateAt, 补 priority=normal */
function migrateData(memos) {
    if (!memos) return;
    Object.keys(memos).forEach(date => {
        (memos[date] || []).forEach(m => {
            if (m.content === undefined && m.text !== undefined) m.content = m.text;
            if (m.updateAt === undefined && m.updatedAt !== undefined) m.updateAt = m.updatedAt;
            if (!m.priority) m.priority = "normal";
            if (m.deleted === undefined) m.deleted = false;
        });
    });
}
function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.config));
    localStorage.setItem(MEMOS_KEY, JSON.stringify(state.memos));
}

function setSyncStatus(type, text) {
    const dot = document.getElementById("syncDot");
    const txt = document.getElementById("syncText");
    dot.className = "status-dot";
    if (type === "error") dot.classList.add("status-error");
    if (type === "success") dot.classList.add("status-success");
    if (type === "wait") dot.classList.add("status-wait");
    txt.innerText = text;
}

/* fetch 带超时（默认10秒），防止网络慢时卡住轮询 */
async function fetchWithTimeout(url, options, timeout) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout || 10000);
    try {
        return await fetch(url, { ...options, signal: ctrl.signal });
    } finally {
        clearTimeout(timer);
    }
}

function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

function renderCalendar() {
    const year = state.currentDate.getFullYear();
    const month = state.currentDate.getMonth();
    document.getElementById("monthTitle").innerText = `${year}年${month+1}月`;
    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";
    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month+1, 0).getDate();
    const today = new Date();
    const todayStr = fmtDate(today);

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell";
        grid.appendChild(empty);
    }
    for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (dateStr === todayStr) cell.classList.add("today");

        const dayNum = document.createElement("div");
        dayNum.className = "day-num";
        dayNum.innerText = d;

        const markWrap = document.createElement("div");
        markWrap.className = "mark-wrap";

        const dayMemos = (state.memos[dateStr] || []).filter(m => !m.deleted);
        if (dayMemos.length > 0) {
            const hasImportant = dayMemos.some(m => m.priority === "important");
            const dot = document.createElement("span");
            dot.className = "mark-" + (hasImportant ? "important" : "normal");
            markWrap.appendChild(dot);
        }

        cell.appendChild(dayNum);
        cell.appendChild(markWrap);
        cell.onclick = () => openMemoModal(dateStr);
        grid.appendChild(cell);
    }
}

function openMemoModal(dateStr) {
    document.getElementById("memoModal").classList.add("show");
    document.getElementById("editDate").value = dateStr;
    document.getElementById("editId").value = "";
    document.getElementById("memoContent").value = "";
    document.getElementById("memoPriority").value = "normal";
    document.getElementById("memoModalTitle").innerText = `${dateStr} 添加备忘`;
    renderDayMemoList(dateStr);
}
function closeMemoModal() {
    document.getElementById("memoModal").classList.remove("show");
}
function renderDayMemoList(dateStr) {
    const wrap = document.getElementById("memoListWrap");
    wrap.innerHTML = "";
    const list = (state.memos[dateStr] || []).filter(m => !m.deleted);
    if (list.length === 0) {
        wrap.innerHTML = '<div class="empty-tip">当天暂无备忘，在下方添加</div>';
        return;
    }
    list.forEach(item => {
        const div = document.createElement("div");
        div.className = `memo-item ${item.priority}`;
        const label = item.priority === "important" ? "重要" : "普通";
        div.innerHTML = `
            <div style="flex:1;word-break:break-word;">${escapeHtml(item.content)} <span style="font-size:12px;color:#a0aec0;margin-left:6px;">[${label}]</span></div>
            <div class="memo-ops">
                <button data-id="${item.id}" class="edit-memo">编辑</button>
                <button data-id="${item.id}" class="del-memo del-btn">删除</button>
            </div>
        `;
        wrap.appendChild(div);
    });
    document.querySelectorAll(".edit-memo").forEach(btn => {
        btn.onclick = () => {
            const id = btn.dataset.id;
            const memo = (state.memos[dateStr] || []).find(m => m.id === id);
            if (!memo) return;
            document.getElementById("editId").value = id;
            document.getElementById("memoContent").value = memo.content;
            document.getElementById("memoPriority").value = memo.priority;
            document.getElementById("memoModalTitle").innerText = `编辑备忘`;
        };
    });
    document.querySelectorAll(".del-memo").forEach(btn => {
        btn.onclick = () => {
            const id = btn.dataset.id;
            const arr = state.memos[dateStr] || [];
            const memo = arr.find(m => m.id === id);
            if (memo) {
                memo.deleted = true;
                memo.updateAt = Date.now();
                saveLocal();
                renderDayMemoList(dateStr);
                renderCalendar();
                debouncePush();
            }
        };
    });
}
function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
}

function saveMemo() {
    const date = document.getElementById("editDate").value;
    const id = document.getElementById("editId").value;
    const content = document.getElementById("memoContent").value.trim();
    const priority = document.getElementById("memoPriority").value;
    if (!content) { alert("请输入备忘内容"); return; }
    if (!state.memos[date]) state.memos[date] = [];
    if (id) {
        const memo = state.memos[date].find(m => m.id === id);
        if (memo) {
            memo.content = content;
            memo.priority = priority;
            memo.updateAt = Date.now();
            memo.deleted = false;
        }
    } else {
        state.memos[date].push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
            content: content,
            priority: priority,
            updateAt: Date.now(),
            deleted: false
        });
    }
    saveLocal();
    closeMemoModal();
    renderCalendar();
    debouncePush();
}

async function findOrCreateGist() {
    const token = state.config.token;
    if (!token) return null;
    const listRes = await fetch(`${GIST_API}/gists?per_page=100`, {
        headers: { Authorization: `token ${token}` }
    });
    if (!listRes.ok) throw new Error("Token 无效或无权限");
    const gists = await listRes.json();
    let best = null, bestCount = -1;
    for (const g of gists) {
        if (g.files && g.files[FILE_NAME]) {
            try {
                const parsed = JSON.parse(g.files[FILE_NAME].content || "{}");
                const count = Object.values(parsed).reduce((s, arr) => s + (arr ? arr.length : 0), 0);
                if (count > bestCount) { bestCount = count; best = g; }
            } catch(e) {}
        }
    }
    if (best) return best.id;
    const createRes = await fetch(`${GIST_API}/gists`, {
        method: "POST",
        headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            description: "备忘录日历数据",
            public: false,
            files: { [FILE_NAME]: { content: "{}" } }
        })
    });
    if (!createRes.ok) throw new Error("创建 Gist 失败");
    const newGist = await createRes.json();
    return newGist.id;
}

function mergeMemos(local, remote) {
    const result = {};
    const allDates = new Set([...Object.keys(local), ...Object.keys(remote)]);
    allDates.forEach(date => {
        const map = {};
        (local[date] || []).forEach(m => map[m.id] = m);
        (remote[date] || []).forEach(m => {
            if (!map[m.id] || (m.updateAt || 0) > (map[m.id].updateAt || 0)) {
                map[m.id] = m;
            }
        });
        const merged = Object.values(map).filter(m => !m.deleted);
        if (merged.length > 0) result[date] = merged;
    });
    return result;
}

async function pullGist() {
    const token = state.config.token;
    if (!token) throw new Error("未配置 Token");
    let gistId = state.config.gistId;
    if (!gistId) {
        gistId = await findOrCreateGist();
        state.config.gistId = gistId;
        saveLocal();
    }
    const res = await fetchWithTimeout(`${GIST_API}/gists/${gistId}`, {
        headers: { Authorization: `token ${token}` }
    }, 10000);
    if (!res.ok) throw new Error("Gist 读取失败 HTTP " + res.status);
    const data = await res.json();
    const file = data.files[FILE_NAME];
    let remote = {};
    if (file && file.content) {
        try { remote = JSON.parse(file.content); } catch(e) {}
    }
    migrateData(remote);
    migrateData(state.memos);
    state.memos = mergeMemos(state.memos, remote);
    saveLocal();
}

async function pushGist() {
    const token = state.config.token;
    if (!token) return;
    let gistId = state.config.gistId;
    if (!gistId) {
        gistId = await findOrCreateGist();
        state.config.gistId = gistId;
        saveLocal();
    }
    await fetch(`${GIST_API}/gists/${gistId}`, {
        method: "PATCH",
        headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            files: { [FILE_NAME]: { content: JSON.stringify(state.memos) } }
        })
    });
}

function debouncePush() {
    clearTimeout(state.syncTimer);
    state.syncTimer = setTimeout(() => {
        pushGist().then(() => setSyncStatus("success", "已同步到 Gist")).catch(e => {
            setSyncStatus("error", "推送失败");
            console.warn(e);
        });
    }, 3000);
}

async function fullSync() {
    try {
        setSyncStatus("wait", "同步中...");
        await pullGist();
        await pushGist();
        renderCalendar();
        setSyncStatus("success", "同步成功");
    } catch (e) {
        setSyncStatus("error", e.message);
        console.error(e);
    }
}

function startPollSync() {
    clearInterval(state.pollTimer);
    let pulling = false;
    state.pollTimer = setInterval(() => {
        if (!state.config.token || document.hidden || pulling) return;
        pulling = true;
        const before = JSON.stringify(state.memos);
        pullGist().then(() => {
            if (JSON.stringify(state.memos) !== before) {
                renderCalendar();
                setSyncStatus("success", "已自动同步到最新");
            }
        }).catch(() => {}).finally(() => { pulling = false; });
    }, 15000);
}

function bindEvents() {
    document.getElementById("prevMonth").onclick = () => {
        state.currentDate.setMonth(state.currentDate.getMonth() - 1);
        renderCalendar();
    };
    document.getElementById("nextMonth").onclick = () => {
        state.currentDate.setMonth(state.currentDate.getMonth() + 1);
        renderCalendar();
    };
    document.getElementById("syncBtn").onclick = fullSync;
    document.getElementById("settingBtn").onclick = () => {
        document.getElementById("settingModal").classList.add("show");
    };
    document.getElementById("closeSettingModal").onclick = () => {
        document.getElementById("settingModal").classList.remove("show");
    };
    document.getElementById("saveSetting").onclick = () => {
        state.config.token = document.getElementById("gistToken").value.trim();
        state.config.gistId = document.getElementById("gistId").value.trim();
        saveLocal();
        document.getElementById("settingModal").classList.remove("show");
        fullSync();
        startPollSync();
    };
    document.getElementById("closeMemoModal").onclick = closeMemoModal;
    document.getElementById("saveMemo").onclick = saveMemo;
    document.querySelectorAll(".modal-mask").forEach(mask => {
        mask.addEventListener("click", e => {
            if (e.target === mask) mask.classList.remove("show");
        });
    });
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.config.token) {
            pullGist().then(() => renderCalendar()).catch(() => {});
        }
    });
}

loadLocal();
renderCalendar();
