<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备忘录日历</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0}
body{background:#f0f7ff;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:32px}
.sync-status{color:#555;margin-bottom:8px}
.btn-sync{background:#3b82f6;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:18px;cursor:pointer}
.calendar-wrap{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px #00000010}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-title{font-size:48px;font-weight:bold}
.btn-month{width:64px;height:64px;border:none;background:#3b82f6;color:#fff;border-radius:12px;font-size:24px;cursor:pointer}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px}
.week-cell{text-align:center;font-size:20px;color:#666;padding:8px}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-cell{aspect-ratio:1/1;border:1px solid #e8e8e8;border-radius:12px;padding:6px;position:relative;cursor:pointer}
.day-cell:hover{background:#f0f7ff}
.day-num{font-size:22px;font-weight:bold}
.day-num.rest{color:red}
.day-num.workday{color:#0066ff}
.tag-ban{position:absolute;top:4px;right:4px;background:#0066ff;color:#fff;font-size:10px;padding:1px 3px;border-radius:4px}
.lunar-text{font-size:12px;color:#666}
.weather-text{font-size:11px;color:#444}
.dot-wrap{position:absolute;bottom:4px;left:4px;display:flex;gap:3px}
.dot-important{width:9px;height:9px;border-radius:50%;background:red;box-shadow:0 0 4px red}
.dot-normal{width:7px;height:7px;border-radius:50%;#888;background:#777}
.legend{margin-top:12px;font-size:14px;color:#444;display:flex;gap:12px;flex-wrap:wrap;padding-top:8px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000060;display:none;align-items:center;justify-content:center;padding:16px}
.modal-inner{background:#fff;border-radius:20px;width:100%;max-width:520px;padding:20px}
.modal-title{font-size:24px;margin-bottom:12px}
textarea{width:100%;min-height:120px;padding:10px;font-size:16px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.select-row{margin-bottom:10px}
button{cursor:pointer}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.img-preview{max-width:100%;margin:8px 0}
</style>
</head>
<body>
<div class="header">
<h1>备忘录日历</h1>
<button class="btn-sync" id="btnSync">立即同步</button>
</div>
<div class="sync-status" id="syncStatus">同步：未加载</div>
<div class="calendar-wrap">
<div class="calendar-header">
<button class="btn-month" id="prevMonth">&lt;</button>
<div class="month-title" id="monthTitle">2026-09</div>
<button class="btn-month" id="nextMonth">&gt;</button>
</div>
<div class="week-row">
<div class="week-cell">日</div>
<div class="week-cell">一</div>
<div class="week-cell">二</div>
<div class="week-cell">三</div>
<div class="week-cell">四</div>
<div class="week-cell">五</div>
<div class="week-cell">六</div>
</div>
<div class="day-grid" id="dayGrid"></div>
<div class="legend">
<span>🔴重要备忘</span>
<span>⚫普通备忘</span>
<span>🟠节日</span>
<span>🟢二十四节气</span>
<span><span style="color:red">红色日期=休息日</span></span>
<span><span style="color:#0066ff">蓝色「班」=调休上班</span></span>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-inner">
<div class="modal-title" id="modalTitle">备忘</div>
<textarea id="memoContent" placeholder="输入备忘内容"></textarea>
<div class="select-row">
<label>优先级：</label>
<select id="memoPriority">
<option value="normal">普通</option>
<option value="important">重要</option>
</select>
</div>
<div>图片：<input type="file" id="imgUpload" accept="image/*"></div>
<div id="imgBox"></div>
<div class="btn-row">
<button id="btnDel">删除</button>
<button id="btnSave">保存</button>
<button id="btnClose">关闭</button>
</div>
</div>
</div>

<script>
// URL读取配置
const params = new URLSearchParams(location.search);
let gistId = params.get('gistid') || localStorage.getItem('gistId');
let token = params.get('token') || localStorage.getItem('token');
if(gistId && token){
localStorage.setItem('gistId',gistId);
localStorage.setItem('token',token);
}

// 2026放假调休数据
const holidayDays = new Set(["2026-01-01","2026-01-02","2026-01-03","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-04-04","2026-04-05","2026-04-06","2026-05-01","2026-05-02","2026-05-03","2026-05-04","2026-05-05","2026-06-19","2026-10-01","2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07"]);
const workDays = new Set(["2026-01-04","2026-02-14","2026-02-28","2026-05-09","2026-09-20","2026-10-10"]);

let currentDate = new Date();
let memoData = {};
let weatherCache = JSON.parse(localStorage.getItem('weatherCache')||"{}");
let activeDayKey = null;
const syncStatusEl = document.getElementById('syncStatus');
const dayGridEl = document.getElementById('dayGrid');
const monthTitleEl = document.getElementById('monthTitle');
const modalEl = document.getElementById('modal');

// 渲染日历骨架（优先渲染，不会阻塞）
function renderCalendar(){
const y = currentDate.getFullYear();
const m = currentDate.getMonth();
monthTitleEl.textContent = `${y}-${String(m+1).padStart(2,'0')}`;
dayGridEl.innerHTML = "";
const firstDay = new Date(y,m,1);
const lastDay = new Date(y,m+1,0);
const startWeek = firstDay.getDay();
const totalDays = lastDay.getDate();
// 前置空白
for(let i=0;i<startWeek;i++){
const empty = document.createElement('div');
empty.className='day-cell';
dayGridEl.appendChild(empty);
}
// 日期格子
for(let d=1;d<=totalDays;d++){
const dayKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const cell = document.createElement('div');
cell.className='day-cell';
cell.dataset.date=dayKey;
const lunar = Lunar.fromDate(new Date(y,m,d));
const lunarStr = lunar.getDayInChinese();
const isHoliday = holidayDays.has(dayKey);
const isWorkDay = workDays.has(dayKey);
const isWeekend = [0,6].includes(new Date(y,m,d).getDay());
const dayNumEl = document.createElement('div');
dayNumEl.className='day-num';
if(isHoliday || isWeekend) dayNumEl.classList.add('rest');
if(isWorkDay) dayNumEl.classList.add('workday');
dayNumEl.textContent = d;
cell.appendChild(dayNumEl);
if(isWorkDay){
const banTag = document.createElement('div');
banTag.className='tag-ban';
banTag.textContent='班';
cell.appendChild(banTag);
}
const lunarEl = document.createElement('div');
lunarEl.className='lunar-text';
lunarEl.textContent = lunarStr;
cell.appendChild(lunarEl);
const weatherEl = document.createElement('div');
weatherEl.className='weather-text';
weatherEl.textContent = weatherCache[dayKey] || "--";
cell.appendChild(weatherEl);
// 备忘圆点
const dotWrap = document.createElement('div');
dotWrap.className='dot-wrap';
if(memoData[dayKey]){
const items = memoData[dayKey];
const hasImportant = items.some(i=>i.priority==='important' && !i.deleted);
if(hasImportant){
const dotImp = document.createElement('span');
dotImp.className='dot-important';
dotWrap.appendChild(dotImp);
}else{
const dotNor = document.createElement('span');
dotNor.className='dot-normal';
dotWrap.appendChild(dotNor);
}
}
cell.appendChild(dotWrap);
cell.onclick = ()=>openMemo(dayKey);
dayGridEl.appendChild(cell);
}
fetchWeather(y,m);
}

// 拉取上海天气
async function fetchWeather(year,month){
const y = year;
const m = month+1;
const start = `${y}-${String(m).padStart(2,'0')}-01`;
const end = `${y}-${String(m).padStart(2,'0')}-31`;
const cacheKey = `${y}-${m}`;
if(weatherCache[cacheKey]){
const data = weatherCache[cacheKey];
fillWeatherToCell(data);
return;
}
try{
const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47&start_date=${start}&end_date=${end}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FShanghai`);
const json = await res.json();
const daily = json.daily;
const weatherObj = {};
for(let i=0;i<daily.time.length;i++){
const dKey = daily.time[i];
const min = daily.temperature_2m_min[i];
const max = daily.temperature_2m_max[i];
const code = daily.weathercode[i];
let icon = "🌤";
if(code===0) icon="☀";
else if([1,2,3].includes(code)) icon="⛅";
else if([45,48].includes(code)) icon="🌫";
else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) icon="🌧";
else if([71,73,75,77,85,86].includes(code)) icon="❄";
weatherObj[dKey] = `${icon}${min}~${max}℃`;
}
weatherCache[cacheKey] = weatherObj;
localStorage.setItem('weatherCache',JSON.stringify(weatherCache));
fillWeatherToCell(weatherObj);
}catch(e){console.log("天气加载失败",e);}
}
function fillWeatherToCell(wObj){
const cells = document.querySelectorAll('.day-cell');
cells.forEach(cell=>{
const dk = cell.dataset.date;
if(wObj[dk]){
cell.querySelector('.weather-text').textContent = wObj[dk];
}
})
}

// Gist同步
async function syncPull(){
if(!gistId || !token){syncStatusEl.textContent="同步：缺少配置";return;}
syncStatusEl.textContent="同步：正在拉取";
try{
const res = await fetch(`https://api.github.com/gists/${gistId}`,{headers:{Authorization:`token ${token}`}});
const gist = await res.json();
const raw = gist.files["memos.json"].content;
memoData = JSON.parse(raw);
syncStatusEl.textContent="同步：拉取成功";
renderCalendar();
}catch(e){
syncStatusEl.textContent="同步：拉取失败";
console.error(e);
}
}
async function syncPush(){
if(!gistId || !token){syncStatusEl.textContent="同步：缺少配置";return;}
syncStatusEl.textContent="同步：推送中";
try{
await fetch(`https://api.github.com/gists/${gistId}`,{
method:"PATCH",
headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},
body:JSON.stringify({files:{"memos.json":{content:JSON.stringify(memoData)}}}})
syncStatusEl.textContent="同步：推送成功";
}catch(e){
syncStatusEl.textContent="同步：推送失败";
console.error(e);
}
}

// 备忘弹窗
function openMemo(dayKey){
activeDayKey = dayKey;
modalEl.style.display='flex';
const items = memoData[dayKey]?.filter(x=>!x.deleted) || [];
document.getElementById('memoContent').value = items.map(i=>i.content).join("\n");
document.getElementById('memoPriority').value = items[0]?.priority || "normal";
}
document.getElementById('btnSave').onclick = async ()=>{
const content = document.getElementById('memoContent').value.trim();
const priority = document.getElementById('memoPriority').value;
if(!memoData[activeDayKey]) memoData[activeDayKey]=[];
memoData[activeDayKey] = memoData[activeDayKey].filter(x=>!x.deleted);
memoData[activeDayKey].push({id:Date.now().toString(),content,priority,deleted:false});
await syncPush();
modalEl.style.display='none';
renderCalendar();
};
document.getElementById('btnDel').onclick = async ()=>{
if(!memoData[activeDayKey]) return;
memoData[activeDayKey].forEach(i=>i.deleted=true);
await syncPush();
modalEl.style.display='none';
renderCalendar();
};
document.getElementById('btnClose').onclick = ()=>modalEl.style.display='none';
document.getElementById('btnSync').onclick = syncPull;
document.getElementById('prevMonth').onclick = ()=>{currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();};
document.getElementById('nextMonth').onclick = ()=>{currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();};

// 初始化
renderCalendar();
if(gistId && token) syncPull();
</script>
</body>
</html>
